testing:
  sampling:
    measurements_count: 5
    total_duration_seconds: 0.5
    sampling_frequency_hz: 10

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

analysis:
  statistical_metrics:
    - mean
    - median
    - standard_deviation
    - minimum
    - maximum
  visualization:
    enabled: true
    plot_types:
      - samples

result_management:
  directory: results
  compare_with_last: 5